global:
  scrape_interval: 5s

scrape_configs:
  # Prometheus itself (IMPORTANT for debugging)
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Node Exporter (CPU/RAM/Disk)
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  # cAdvisor (containers)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Jenkins (ONLY works if plugin is enabled)
  - job_name: "jenkins"
    metrics_path: /prometheus
    static_configs:
      - targets: ["jenkins:8080"]
